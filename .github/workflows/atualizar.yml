name: Atualizar dados

on:
  schedule:
    - cron: "*/15 * * * *"   # a cada 15 minutos (o GitHub às vezes atrasa alguns minutos)
  workflow_dispatch:          # permite rodar na mão pelo botão "Run workflow"

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar ANA e INMET
        run: node coletar.js
      - name: Salvar dados.json
        run: |
          git config user.name "crave-robo"
          git config user.email "crave-robo@users.noreply.github.com"
          git add dados.json
          git commit -m "Atualiza dados $(date -u +%Y-%m-%dT%H:%MZ)" || echo "sem mudanças"
          git pull --rebase
          git push
